# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  fabric:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build fabric
        run: ./gradlew :fabric:build --no-daemon
      - name: publish fabric
        run: ./gradlew publishFabric --no-daemon
      - name: capture fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bobidelight-fabric
          path: |
            fabric/build/libs/*
            fabric/mcmodsrepo/**

  forge:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build forge
        run: ./gradlew :forge:build --no-daemon
      - name: publish forge
        run: ./gradlew publishForge --no-daemon
      - name: capture forge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bobidelight-forge
          path: |
            forge/build/libs/*
            forge/mcmodsrepo/**
